<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Untuk Ratu Fatimah ♡</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Playfair+Display:ital,wght@0,500;0,600;1,500;1,600&display=swap');

*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  background:#efe9e2;color:#3d3531;font-family:'DM Sans',sans-serif;
  overflow-x:hidden;
}
body:before{
  content:"";position:fixed;inset:0;pointer-events:none;opacity:.25;z-index:50;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.18'/%3E%3C/svg%3E");
}
#opening{
  position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;
  background:#716e65;transition:opacity 1s,visibility 1s;
}
#opening.hide{opacity:0;visibility:hidden;pointer-events:none}
.open-card{text-align:center;color:#f9f5ef;padding:30px}
.open-card .tiny{letter-spacing:4px;font-size:10px;text-transform:uppercase;opacity:.8}
.open-card h1{font-family:'Playfair Display',serif;font-size:44px;font-weight:500;margin:18px 0 8px}
.open-card p{font-size:14px;opacity:.82;margin-bottom:28px}
.open-btn{
  border:1px solid rgba(255,255,255,.65);background:rgba(255,255,255,.08);color:white;
  padding:13px 28px;border-radius:30px;font:500 12px 'DM Sans';letter-spacing:1.5px;
  cursor:pointer;transition:.3s;
}
.open-btn:hover{background:white;color:#4e4a44}
#main{opacity:0;transition:opacity 1.2s}
#main.show{opacity:1}
section{max-width:720px;margin:auto;padding:80px 22px}
.hero{min-height:100vh;display:flex;flex-direction:column;justify-content:center;text-align:center;padding-top:90px}
.eyebrow{font-size:10px;letter-spacing:4px;text-transform:uppercase;color:#81776e}
.hero h2{font:italic 500 clamp(42px,12vw,72px) 'Playfair Display';line-height:.95;margin:18px 0}
.hero h2 span{font-style:normal}
.hero .date{font-size:12px;letter-spacing:2px;margin-top:20px;color:#71665e}
.heart{font-size:18px;margin-top:28px;animation:pulse 1.7s infinite}
@keyframes pulse{50%{transform:scale(1.25)}}

.photo-stack{position:relative;height:470px;margin:30px auto 0;max-width:420px}
.photo-stack img{position:absolute;width:72%;height:390px;object-fit:cover;border:9px solid #faf7f2;box-shadow:0 12px 35px rgba(70,55,45,.16)}
.photo-stack img:nth-child(1){left:4%;top:35px;transform:rotate(-6deg)}
.photo-stack img:nth-child(2){right:3%;top:0;transform:rotate(6deg)}
.photo-stack img:nth-child(n+3){display:none}

.intro{text-align:center}
.intro h3,.story h3,.letter h3{font:italic 500 34px 'Playfair Display';margin-bottom:20px}
.intro p,.story p,.letter p{font-size:15px;line-height:1.9;color:#5e554f}
.rule{width:48px;height:1px;background:#9b8e84;margin:25px auto}

.gallery{padding-top:40px}
.gallery-grid{display:grid;grid-template-columns:1fr 1fr;gap:13px}
.gallery-grid img{width:100%;height:260px;object-fit:cover;border-radius:2px}
.gallery-grid img:nth-child(2){margin-top:35px}
.gallery-grid img:nth-child(3){height:320px}
.gallery-grid img:nth-child(4){margin-top:-5px;height:320px}
.gallery-grid img:nth-child(5){grid-column:1/-1;height:390px}

.story{padding-top:90px}
.story-card{border-left:1px solid #a99d93;padding-left:22px;margin:30px 0}
.story-card .num{font-size:10px;letter-spacing:3px;color:#93867d}
.story-card h4{font:500 23px 'Playfair Display';margin:8px 0}
.story-card p{font-size:14px;line-height:1.75}

.letter{padding-top:90px;text-align:center}
.envelope-wrap{height:250px;display:flex;align-items:center;justify-content:center;margin:20px 0}
.envelope{position:relative;width:280px;height:180px;background:#d7c8ba;cursor:pointer;box-shadow:0 18px 35px rgba(60,45,35,.15);transition:.5s}
.envelope:before{content:"";position:absolute;left:0;top:0;border-left:140px solid transparent;border-right:140px solid transparent;border-top:92px solid #c5b2a1;z-index:3;transform-origin:top;transition:.6s}
.envelope:after{content:"";position:absolute;bottom:0;left:0;border-left:140px solid #bca999;border-top:90px solid transparent;border-right:140px solid #bca999;z-index:2}
.envelope.open:before{transform:rotateX(180deg)}
.seal{position:absolute;z-index:5;left:50%;top:78px;transform:translateX(-50%);width:42px;height:42px;border-radius:50%;background:#7c7168;color:white;display:grid;place-items:center;font-size:16px;transition:.4s}
.envelope.open .seal{opacity:0;transform:translate(-50%,-20px)}
.letter-text{display:none;text-align:left;background:#faf6f0;padding:28px;border:1px solid #e1d8d0;line-height:1.9;font-size:14px;box-shadow:0 10px 30px rgba(70,55,45,.08)}
.letter-text.show{display:block;animation:up .8s}
@keyframes up{from{opacity:0;transform:translateY(15px)}to{opacity:1;transform:none}}

.final{text-align:center;min-height:85vh;display:flex;flex-direction:column;justify-content:center}
.final .big{font:italic 500 clamp(43px,12vw,70px) 'Playfair Display';line-height:1}
.final p{margin:25px auto;max-width:520px;line-height:1.9;font-size:14px;color:#625851}
.signature{font:italic 22px 'Playfair Display';margin-top:25px}
.music{
  position:fixed;right:16px;bottom:16px;z-index:80;width:46px;height:46px;border-radius:50%;
  border:1px solid #b4a69b;background:rgba(250,247,242,.9);color:#625851;cursor:pointer;
  box-shadow:0 5px 20px rgba(50,40,30,.12)
}
.music-note{font-size:17px}
#songInput{display:none}
.music-label{
 position:fixed;right:18px;bottom:69px;z-index:80;font-size:9px;letter-spacing:1px;
 background:rgba(250,247,242,.92);padding:7px 10px;border-radius:12px;color:#6d625b;opacity:0;
 transition:.3s
}
.music:hover + .music-label{opacity:1}
.confetti{position:fixed;z-index:120;pointer-events:none;font-size:18px;animation:fall 2.6s linear forwards}
@keyframes fall{0%{transform:translateY(-20px) rotate(0);opacity:1}100%{transform:translateY(105vh) rotate(540deg);opacity:0}}
.footer{padding:25px;text-align:center;font-size:9px;letter-spacing:2px;color:#9a8d83}

@media(max-width:500px){
  section{padding-left:18px;padding-right:18px}
  .photo-stack{height:390px}
  .photo-stack img{height:330px}
  .gallery-grid img{height:220px}
  .gallery-grid img:nth-child(3),.gallery-grid img:nth-child(4){height:270px}
  .gallery-grid img:nth-child(5){height:300px}
}
</style>
</head>
<body>

<div id="opening">
  <div class="open-card">
    <div class="tiny">a little something for</div>
    <h1>Ratu Fatimah</h1>
    <p>from your boyfriend, with love ♡</p>
    <button class="open-btn" onclick="openSite()">OPEN MY LETTER</button>
  </div>
</div>

<audio id="audio" loop>
  <source src="Backstreet Boys - Shape of My Heart (Lyrics) ,mp3"
    type="audio/mpeg">
<button class="music" onclick="document.getElementById('songInput').click()" title="Pilih lagu">
  <span class="music-note">♫</span>
</button>
<div class="music-label">pilih lagu "Give Me Your Forever"</div>
<input id="songInput" type="file" accept="audio/*" onchange="loadSong(event)">

<div id="main">
<section class="hero">
  <div class="eyebrow">31 August · your special day</div>
  <h2>Happy Birthday,<br><span>Ratu Fatimah</span> ♡</h2>
  <div class="date">from the one who loves you</div>
  <div class="heart">♡</div>
  <div class="photo-stack">
    <img src="foto1.jpg" alt="our photo">
    <img src="foto2.jpg" alt="our photo">
  </div>
</section>

<section class="intro">
  <h3>today is about you.</h3>
  <div class="rule"></div>
  <p>
    Selamat ulang tahun, sayang. Hari ini mungkin cuma satu tanggal
    di kalender, tapi buat aku, hari ini jauh lebih dari itu.
    Hari ini adalah hari lahirnya seseorang yang akhirnya menjadi
    bagian paling manis dari cerita hidupku.
  </p>
</section>

<section class="gallery">
  <div class="eyebrow" style="text-align:center;margin-bottom:24px">little pieces of us</div>
  <div class="gallery-grid">
    <img src="foto3.jpg" alt="our memory">
    <img src="foto4.jpg" alt="our memory">
    <img src="foto5.jpg" alt="our memory">
    <img src="foto1.jpg" alt="our memory">
    <img src="foto2.jpg" alt="our memory">
  </div>
</section>

<section class="story">
  <div class="eyebrow">our little story</div>
  <h3>ternyata, ketidaksengajaan bisa jadi indah.</h3>
  <p>
    Kita cuma sepasang kekasih yang awalnya tidak pernah menyangka
    akan sampai sejauh ini. Berawal dari sebuah ketidaksengajaan,
    dari hal-hal kecil yang mungkin waktu itu terasa biasa saja,
    pelan-pelan kita jadi saling mengenal, saling nyaman, dan
    akhirnya saling mencintai.
  </p>
  <div class="story-card">
    <div class="num">01 · THEN</div>
    <h4>Awalnya cuma kebetulan.</h4>
    <p>Kalau waktu itu semuanya berjalan sedikit berbeda, mungkin kita tidak akan pernah menjadi kita.</p>
  </div>
  <div class="story-card">
    <div class="num">02 · NOW</div>
    <h4>Lalu kita memilih untuk tinggal.</h4>
    <p>Di antara banyak orang yang bisa datang dan pergi, kita memilih untuk saling menggenggam dan terus belajar satu sama lain.</p>
  </div>
  <div class="story-card">
    <div class="num">03 · ALWAYS</div>
    <h4>Semoga tetap kita.</h4>
    <p>Aku nggak janji semuanya akan selalu mudah. Tapi aku ingin, selama kita masih saling sayang, kita tetap mencari jalan untuk pulang satu sama lain.</p>
  </div>
</section>

<section class="letter">
  <div class="eyebrow">one more thing...</div>
  <h3>ada surat kecil buat kamu.</h3>
  <p style="font-size:12px;margin-bottom:10px">tap amplopnya ♡</p>
  <div class="envelope-wrap">
    <div class="envelope" id="envelope" onclick="openLetter()">
      <div class="seal">♡</div>
    </div>
  </div>
  <div class="letter-text" id="letterText">
    <p>
      Hai sayang,<br><br>
      Selamat ulang tahun yaa. Terima kasih sudah hadir di hidup aku,
      terima kasih sudah mau bertahan sejauh ini, dan terima kasih
      untuk semua hal kecil yang mungkin sering kamu anggap sepele,
      padahal berarti banget buat aku.
      <br><br>
      Aku suka cara kita tumbuh bareng. Kadang kita ketawa karena
      hal yang nggak jelas, kadang juga ada salah paham dan hari-hari
      yang nggak berjalan sesuai keinginan. Tapi justru dari sana
      aku semakin sadar kalau aku nggak cuma ingin ada di saat
      semuanya menyenangkan.
      <br><br>
      Aku ingin tetap ada. Menemani kamu, mendengarkan cerita kamu,
      melihat kamu mengejar hal-hal yang kamu mau, dan sebisa mungkin
      menjadi tempat yang selalu terasa nyaman buat kamu.
      <br><br>
      Semoga di umur kamu yang baru ini, lebih banyak hal baik yang
      datang. Semoga kamu selalu dikelilingi orang-orang yang sayang
      sama kamu, dan semoga semua doa yang selama ini kamu simpan
      pelan-pelan menemukan jalannya.
      <br><br>
      Dan kalau suatu hari nanti kita melihat kembali semua foto ini,
      aku berharap kita bisa tersenyum sambil bilang,
      <i>"ternyata kita sudah sejauh ini ya."</i>
      <br><br>
      I love you. More than these words can explain.
      <br><br>
      <span class="signature">Your Boyfriend ♡</span>
    </p>
  </div>
</section>

<section class="final">
  <div class="eyebrow">for you, always</div>
  <div class="big">Give me your forever.</div>
  <p>
    Bukan karena aku tahu masa depan akan seperti apa,
    tapi karena kalau boleh memilih, aku ingin melihat
    banyak halaman berikutnya bersamamu.
  </p>
  <div class="signature">Happy birthday, Ratu. ♡</div>
</section>

<div class="footer">made with love · 31.08.2026</div>
</div>

<script>
function openSite(){
  document.getElementById('opening').classList.add('hide');
  document.getElementById('main').classList.add('show');
  burst();
}
function openLetter(){
  const e=document.getElementById('envelope');
  const t=document.getElementById('letterText');
  e.classList.toggle('open');
  t.classList.toggle('show');
  if(t.classList.contains('show')) burst();
}
function burst(){
  const chars=['♡','♥','✦','✧','·'];
  for(let i=0;i<28;i++){
    const s=document.createElement('span');
    s.className='confetti';
    s.textContent=chars[Math.floor(Math.random()*chars.length)];
    s.style.left=(Math.random()*100)+'vw';
    s.style.top='-20px';
    s.style.animationDelay=(Math.random()*0.9)+'s';
    s.style.fontSize=(12+Math.random()*16)+'px';
    document.body.appendChild(s);
    setTimeout(()=>s.remove(),3500);
  }
}
function loadSong(event){
  const file=event.target.files[0];
  if(!file) return;
  const audio=document.getElementById('audio');
  audio.src=URL.createObjectURL(file);
  audio.play().catch(()=>{});
  alert('Lagunya sudah dipasang ♫\\nPilih file lagu "Give Me Your Forever" dari HP kamu.');
}
</script>
</body>
</html>
